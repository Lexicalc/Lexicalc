<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lexicalc</title>
<link rel="canonical" href="https://lexicalc.github.io/">
<meta http-equiv="refresh" content="2;url=https://lexicalc.github.io/">
<script>
  // Keeps the rest of the address (duel links, ?codes, #anchors) so nothing is lost
  var p = location.pathname.replace(/^\/lexicalc(?=\/|$)/i, "") || "/";
  if (p === location.pathname) location.replace("https://lexicalc.github.io/"); // unknown page: home
  else location.replace("https://lexicalc.github.io" + p + location.search + location.hash);
</script>
</head>
<body style="margin:0;background:#fbf6ee;color:#1d2433;font:18px system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box">
<div>
<h2 style="color:#0f8b8d">Lexicalc</h2>
<p><a href="https://lexicalc.github.io/" style="color:#0f8b8d;font-weight:700">lexicalc.github.io</a></p>
</div>
</body>
</html>
